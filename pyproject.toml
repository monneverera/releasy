[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "releasy"
version = "0.1.0"
description = "A zero-dependency, lightning-fast micro CLI for conventional changelogs and SemVer releases."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Remon", email = "monneverera@users.noreply.github.com" },
    { name = "Orion", email = "orion@lumenresearch.ai" }
]
keywords = ["git", "release", "semver", "changelog", "conventional-commits", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
releasy = "releasy.cli:main"
